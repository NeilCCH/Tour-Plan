name: Supabase keepalive

# 免費 Supabase 專案「連續 7 天沒有任何連線」就會自動暫停。
# 這個排程每週一、四各連一次資料庫(讀 1 筆即可),讓專案保持活躍,不會被暫停。
# URL 與 anon key 都是公開安全的(anon key 本來就設計成公開,真正保護靠資料庫 RLS)。
# 也可以到 repo 的 Actions 分頁手動按「Run workflow」立即執行一次。

on:
  schedule:
    - cron: '17 2 * * 1,4'   # 每週一、四 02:17 UTC 各觸發一次(避開整點尖峰)
  workflow_dispatch:          # 允許手動執行

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST（保持免費專案活躍）
        run: |
          URL="https://pwjyqxpadaadvbecrckw.supabase.co/rest/v1/trips?select=id&limit=1"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3anlxeHBhZGFhZHZiZWNyY2t3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNzczMDcsImV4cCI6MjEwMDk1MzMwN30.PmWg8Charfop5-6RL0N40QsarISXTlwrlvRILJ7vIEQ"
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$URL")
          echo "HTTP status: $code"
          echo "Response: $(cat /tmp/resp.txt)"
          # 2xx/4xx 都代表伺服器有回應=資料庫醒著;只有連不上(5xx/000)才算失敗
          if [ -n "$code" ] && [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
            echo "OK：Supabase 有回應（$code），專案保持活躍。"
          else
            echo "Ping 失敗（$code）——專案可能已暫停,請到 Supabase 後台 Restore。"
            exit 1
          fi
